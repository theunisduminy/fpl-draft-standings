name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: nobody needs the verdict
# on a commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # corepack honours the `packageManager` pin in package.json, which is what
      # keeps CI, local and Vercel on one pnpm major. See agents/AGENTS.md.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each step runs even if an earlier one failed, so one push reports every
      # problem rather than one per round trip.
      - run: pnpm lint
        if: '!cancelled()'

      - run: pnpm typecheck
        if: '!cancelled()'

      - run: pnpm test
        if: '!cancelled()'

      - run: pnpm format:check
        if: '!cancelled()'
